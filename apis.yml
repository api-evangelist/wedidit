name: WeDidIt
description: WeDidIt was a Brooklyn, New York fundraising platform founded in 2012 by Su
  Sanni and Benjamin Lamson that gave small nonprofits online donation pages, crowdfunding,
  peer-to-peer, ticketing, and fiscal-sponsorship tools, plus a mobile app for in-person
  card donations. A 500 Global portfolio company and 43North winner, it was acquired
  by Allegiance Fundraising Group in June 2019 and its product folded into the Allegiance
  suite. No public developer API was ever documented, and the wedid.it domain has since
  lapsed to an unrelated site, so no API surface remains to profile.
